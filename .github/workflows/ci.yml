name: Package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Linked project-case contracts
        run: |
          node examples/project-case/verify.mjs
          node examples/project-case/zh-CN/verify.mjs
          node examples/project-case/ja/verify.mjs
          python3 scripts/build-localized-starter.py en --check
          python3 scripts/build-localized-starter.py ja --check
      - name: Browser rendering and export checks
        run: npm run test:browser
      - name: Standalone PM Skill workflow
        run: |
          node scripts/build-pm-runtime.mjs --check
          node scripts/verify-pm-demo.mjs
          node scripts/check-pm-skill.mjs
          node scripts/check-pm-scale.mjs
          python3 scripts/build-pm-skill.py --check
      - run: npm pack --dry-run
