 y="116.1" class="head"><tspan x="1322" dy="0">Closure evidence required</tspan></text><rect x="24" y="174.2" width="300" height="264.70000000000005" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="37" y="210.29999999999998"><tspan x="37" dy="0">ISSUE-01 | CRM sandbox</tspan><tspan x="37" dy="34.1">authentication returns</tspan><tspan x="37" dy="34.1">401 | investigating</tspan><tspan x="37" dy="34.1">The 2026-10-12 </tspan><tspan x="37" dy="34.1">completion baseline </tspan><tspan x="37" dy="34.1">has passed.</tspan></text><rect x="324" y="174.2" width="240" height="264.70000000000005" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="337" y="210.29999999999998"><tspan x="337" dy="0">Real-endpoint </tspan><tspan x="337" dy="34.1">end-to-end </tspan><tspan x="337" dy="34.1">validation is </tspan><tspan x="337" dy="34.1">blocked. Mocks </tspan><tspan x="337" dy="34.1">are limited to </tspan><tspan x="337" dy="34.1">independent UI </tspan><tspan x="337" dy="34.1">work.</tspan></text><rect x="564" y="174.2" width="200" height="264.70000000000005" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="577" y="210.29999999999998"><tspan x="577" dy="0">Development </tspan><tspan x="577" dy="34.1">Lead</tspan><tspan x="577" dy="34.1">Support: CRM </tspan><tspan x="577" dy="34.1">Vendor</tspan></text><rect x="764" y="174.2" width="215" height="264.70000000000005" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="777" y="210.29999999999998"><tspan x="777" dy="0">Cause/recovery </tspan><tspan x="777" dy="34.1">reply: </tspan><tspan x="777" dy="34.1">2026-10-15</tspan><tspan x="777" dy="34.1">Completion </tspan><tspan x="777" dy="34.1">forecast: </tspan><tspan x="777" dy="34.1">2026-10-18</tspan></text><rect x="979" y="174.2" width="330" height="264.70000000000005" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="992" y="210.29999999999998"><tspan x="992" dy="0">Investigate </tspan><tspan x="992" dy="34.1">cause/recovery with the </tspan><tspan x="992" dy="34.1">vendor; issue a dated </tspan><tspan x="992" dy="34.1">forecast and ask Quality </tspan><tspan x="992" dy="34.1">to retest the real </tspan><tspan x="992" dy="34.1">connection.</tspan></text><rect x="1309" y="174.2" width="330" height="264.70000000000005" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="1322" y="210.29999999999998"><tspan x="1322" dy="0">Closure requires restored</tspan><tspan x="1322" dy="34.1">real-endpoint </tspan><tspan x="1322" dy="34.1">authentication plus the </tspan><tspan x="1322" dy="34.1">necessary retry/retest </tspan><tspan x="1322" dy="34.1">records. Reaching the </tspan><tspan x="1322" dy="34.1">forecast date alone is </tspan><tspan x="1322" dy="34.1">not closure.</tspan></text><rect x="24" y="438.90000000000003" width="300" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="37" y="475.00000000000006"><tspan x="37" dy="0">ISSUE-02 | </tspan><tspan x="37" dy="34.1">Trial-migration </tspan><tspan x="37" dy="34.1">reconciliation </tspan><tspan x="37" dy="34.1">differences | awaiting</tspan><tspan x="37" dy="34.1">rule decision</tspan><tspan x="37" dy="34.1">80 duplicate-key </tspan><tspan x="37" dy="34.1">candidates among </tspan><tspan x="37" dy="34.1">20,000 source records.</tspan></text><rect x="324" y="438.90000000000003" width="240" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="337" y="475.00000000000006"><tspan x="337" dy="0">Merge/exclusion </tspan><tspan x="337" dy="34.1">rules are </tspan><tspan x="337" dy="34.1">unresolved; the </tspan><tspan x="337" dy="34.1">evidence for data</tspan><tspan x="337" dy="34.1">acceptance is </tspan><tspan x="337" dy="34.1">incomplete.</tspan></text><rect x="564" y="438.90000000000003" width="200" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="577" y="475.00000000000006"><tspan x="577" dy="0">Business Lead</tspan><tspan x="577" dy="34.1">Execution: </tspan><tspan x="577" dy="34.1">Development </tspan><tspan x="577" dy="34.1">and Operations</tspan></text><rect x="764" y="438.90000000000003" width="215" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="777" y="475.00000000000006"><tspan x="777" dy="0">Rule decision: </tspan><tspan x="777" dy="34.1">2026-10-16</tspan><tspan x="777" dy="34.1">Forecast </tspan><tspan x="777" dy="34.1">recheck finish:</tspan><tspan x="777" dy="34.1">2026-10-23</tspan></text><rect x="979" y="438.90000000000003" width="330" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="992" y="475.00000000000006"><tspan x="992" dy="0">Business reviews the </tspan><tspan x="992" dy="34.1">candidates and approves a</tspan><tspan x="992" dy="34.1">rule. Repeat the trial </tspan><tspan x="992" dy="34.1">from original data and </tspan><tspan x="992" dy="34.1">reconcile results with </tspan><tspan x="992" dy="34.1">Quality.</tspan></text><rect x="1309" y="438.90000000000003" width="330" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="1322" y="475.00000000000006"><tspan x="1322" dy="0">Closure requires the </tspan><tspan x="1322" dy="34.1">approved rule, 80 </tspan><tspan x="1322" dy="34.1">candidate dispositions, </tspan><tspan x="1322" dy="34.1">traceability for 20,000 </tspan><tspan x="1322" dy="34.1">records/approved </tspan><tspan x="1322" dy="34.1">exclusions, count </tspan><tspan x="1322" dy="34.1">reconciliation and </tspan><tspan x="1322" dy="34.1">business sample evidence.</tspan></text><rect x="24" y="737.7" width="300" height="503.40000000000003" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="37" y="773.8000000000001"><tspan x="37" dy="0">ISSUE-03 | CR-01 </tspan><tspan x="37" dy="34.1">requests first-release</tspan><tspan x="37" dy="34.1">SMS | awaiting change </tspan><tspan x="37" dy="34.1">decision</tspan><tspan x="37" dy="34.1">Provisional estimate: </tspan><tspan x="37" dy="34.1">+8 person-days / +JPY </tspan><tspan x="37" dy="34.1">600,000.</tspan></text><rect x="324" y="737.7" width="240" height="503.40000000000003" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="337" y="773.8000000000001"><tspan x="337" dy="0">Scope, funding, </tspan><tspan x="337" dy="34.1">personal </tspan><tspan x="337" dy="34.1">information and </tspan><tspan x="337" dy="34.1">delivery dates </tspan><tspan x="337" dy="34.1">are affected. </tspan><tspan x="337" dy="34.1">Current scope </tspan><tspan x="337" dy="34.1">remains </tspan><tspan x="337" dy="34.1">in-app/email.</tspan></text><rect x="564" y="737.7" width="200" height="503.40000000000003" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="577" y="773.8000000000001"><tspan x="577" dy="0">Project </tspan><tspan x="577" dy="34.1">Manager (PM)</tspan><tspan x="577" dy="34.1">Final </tspan><tspan x="577" dy="34.1">decision: </tspan><tspan x="577" dy="34.1">Sponsor</tspan></text><rect x="764" y="737.7" width="215" height="503.40000000000003" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="777" y="773.8000000000001"><tspan x="777" dy="0">Change meeting:</tspan><tspan x="777" dy="34.1">2026-10-16</tspan></text><rect x="979" y="737.7" width="330" height="503.40000000000003" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="992" y="773.8000000000001"><tspan x="992" dy="0">Assess options with </tspan><tspan x="992" dy="34.1">Business, Development and</tspan><tspan x="992" dy="34.1">Information Management; </tspan><tspan x="992" dy="34.1">present approval/rejectio</tspan><tspan x="992" dy="34.1">n/deferral and </tspan><tspan x="992" dy="34.1">communicate the decision.</tspan></text><rect x="1309" y="737.7" width="330" height="503.40000000000003" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="1322" y="773.8000000000001"><tspan x="1322" dy="0">Closure requires the </tspan><tspan x="1322" dy="34.1">Sponsor decision and </tspan><tspan x="1322" dy="34.1">requester receipt. </tspan><tspan x="1322" dy="34.1">Rejection or deferral </tspan><tspan x="1322" dy="34.1">must be communicated. For</tspan><tspan x="1322" dy="34.1">an approved change, </tspan><tspan x="1322" dy="34.1">record the effective </tspan><tspan x="1322" dy="34.1">baseline, scope, cost, </tspan><tspan x="1322" dy="34.1">dates and owners, then </tspan><tspan x="1322" dy="34.1">obtain independent </tspan><tspan x="1322" dy="34.1">verification and business</tspan><tspan x="1322" dy="34.1">acceptance before closing</tspan><tspan x="1322" dy="34.1">CR-01. Do not start while</tspan><tspan x="1322" dy="34.1">unresolved.</tspan></text><rect x="24" y="1241.1000000000001" width="300" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="37" y="1277.2"><tspan x="37" dy="0">ISSUE-04 | Validation </tspan><tspan x="37" dy="34.1">resource conflict | </tspan><tspan x="37" dy="34.1">coordination open</tspan><tspan x="37" dy="34.1">A key business user is</tspan><tspan x="37" dy="34.1">assigned elsewhere </tspan><tspan x="37" dy="34.1">during 2026-10-19 to </tspan><tspan x="37" dy="34.1">2026-10-23; estimated </tspan><tspan x="37" dy="34.1">gap: 3 person-days.</tspan></text><rect x="324" y="1241.1000000000001" width="240" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="337" y="1277.2"><tspan x="337" dy="0">Required business</tspan><tspan x="337" dy="34.1">validation is not</tspan><tspan x="337" dy="34.1">staffed; the </tspan><tspan x="337" dy="34.1">2026-10-26 </tspan><tspan x="337" dy="34.1">trial-testing </tspan><tspan x="337" dy="34.1">forecast is at </tspan><tspan x="337" dy="34.1">risk.</tspan></text><rect x="564" y="1241.1000000000001" width="200" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="577" y="1277.2"><tspan x="577" dy="0">Project </tspan><tspan x="577" dy="34.1">Manager (PM)</tspan><tspan x="577" dy="34.1">Consult: </tspan><tspan x="577" dy="34.1">Business and </tspan><tspan x="577" dy="34.1">Quality</tspan></text><rect x="764" y="1241.1000000000001" width="215" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="777" y="1277.2"><tspan x="777" dy="0">Replacement/rea</tspan><tspan x="777" dy="34.1">llocation </tspan><tspan x="777" dy="34.1">decision: </tspan><tspan x="777" dy="34.1">2026-10-16</tspan></text><rect x="979" y="1241.1000000000001" width="330" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="992" y="1277.2"><tspan x="992" dy="0">Agree </tspan><tspan x="992" dy="34.1">replacement/reallocation </tspan><tspan x="992" dy="34.1">with the other project. </tspan><tspan x="992" dy="34.1">Escalate residual gaps </tspan><tspan x="992" dy="34.1">and replanning; do not </tspan><tspan x="992" dy="34.1">silently drop mandatory </tspan><tspan x="992" dy="34.1">cases.</tspan></text><rect x="1309" y="1241.1000000000001" width="330" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="1322" y="1277.2"><tspan x="1322" dy="0">Closure requires named </tspan><tspan x="1322" dy="34.1">staff/time agreements and</tspan><tspan x="1322" dy="34.1">Quality confirmation that</tspan><tspan x="1322" dy="34.1">the revised validation </tspan><tspan x="1322" dy="34.1">plan is feasible. </tspan><tspan x="1322" dy="34.1">Availability is not yet </tspan><tspan x="1322" dy="34.1">secured.</tspan></text><rect x="24" y="1539.9" width="300" height="264.70000000000005" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="37" y="1576"><tspan x="37" dy="0">ISSUE-05 | </tspan><tspan x="37" dy="34.1">Night-operations </tspan><tspan x="37" dy="34.1">ownership is unclear |</tspan><tspan x="37" dy="34.1">action open</tspan><tspan x="37" dy="34.1">Exception handover </tspan><tspan x="37" dy="34.1">across the 3 service </tspan><tspan x="37" dy="34.1">desks is not agreed.</tspan></text><rect x="324" y="1539.9" width="240" height="264.70000000000005" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="337" y="1576"><tspan x="337" dy="0">Response to a </tspan><tspan x="337" dy="34.1">serious night </tspan><tspan x="337" dy="34.1">incident and </tspan><tspan x="337" dy="34.1">rollback </tspan><tspan x="337" dy="34.1">reporting could </tspan><tspan x="337" dy="34.1">be delayed.</tspan></text><rect x="564" y="1539.9" width="200" height="264.70000000000005" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="577" y="1576"><tspan x="577" dy="0">Operations </tspan><tspan x="577" dy="34.1">Lead</tspan></text><rect x="764" y="1539.9" width="215" height="264.70000000000005" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="777" y="1576"><tspan x="777" dy="0">Primary/backup </tspan><tspan x="777" dy="34.1">contacts and </tspan><tspan x="777" dy="34.1">drill: </tspan><tspan x="777" dy="34.1">2026-10-20</tspan></text><rect x="979" y="1539.9" width="330" height="264.70000000000005" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="992" y="1576"><tspan x="992" dy="0">Name primary/backup </tspan><tspan x="992" dy="34.1">contacts and an </tspan><tspan x="992" dy="34.1">unreachable-contact </tspan><tspan x="992" dy="34.1">escalation route. </tspan><tspan x="992" dy="34.1">Rehearse stop, rollback </tspan><tspan x="992" dy="34.1">and restart notification;</tspan><tspan x="992" dy="34.1">inform Business.</tspan></text><rect x="1309" y="1539.9" width="330" height="264.70000000000005" fill="#FFFFFF" stroke="#E7E8E9" stroke-width="1"/><text x="1322" y="1576"><tspan x="1322" dy="0">Closure requires </tspan><tspan x="1322" dy="34.1">contact-chain receipt, a </tspan><tspan x="1322" dy="34.1">drill including </tspan><tspan x="1322" dy="34.1">unavailable contacts, </tspan><tspan x="1322" dy="34.1">recovery reconciliation </tspan><tspan x="1322" dy="34.1">and business </tspan><tspan x="1322" dy="34.1">restart-notice evidence.</tspan></text><rect x="24" y="1804.6000000000001" width="300" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="37" y="1840.7"><tspan x="37" dy="0">ISSUE-06 | Trial </tspan><tspan x="37" dy="34.1">validation remains </tspan><tspan x="37" dy="34.1">incomplete</tspan><tspan x="37" dy="34.1">30 cases: 18 passed, 5</tspan><tspan x="37" dy="34.1">failed, 4 blocked, 3 </tspan><tspan x="37" dy="34.1">not run.</tspan></text><rect x="324" y="1804.6000000000001" width="240" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="337" y="1840.7"><tspan x="337" dy="0">Trial checking is</tspan><tspan x="337" dy="34.1">incomplete. </tspan><tspan x="337" dy="34.1">Formal acceptance</tspan><tspan x="337" dy="34.1">still requires </tspan><tspan x="337" dy="34.1">independent </tspan><tspan x="337" dy="34.1">retesting and </tspan><tspan x="337" dy="34.1">business </tspan><tspan x="337" dy="34.1">approval.</tspan></text><rect x="564" y="1804.6000000000001" width="200" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="577" y="1840.7"><tspan x="577" dy="0">Quality Lead</tspan><tspan x="577" dy="34.1">Business </tspan><tspan x="577" dy="34.1">acceptance: </tspan><tspan x="577" dy="34.1">Business Lead</tspan></text><rect x="764" y="1804.6000000000001" width="215" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="777" y="1840.7"><tspan x="777" dy="0">Trial-testing </tspan><tspan x="777" dy="34.1">forecast: </tspan><tspan x="777" dy="34.1">2026-10-26</tspan><tspan x="777" dy="34.1">Formal </tspan><tspan x="777" dy="34.1">acceptance </tspan><tspan x="777" dy="34.1">required before</tspan><tspan x="777" dy="34.1">Go / No Go</tspan></text><rect x="979" y="1804.6000000000001" width="330" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="992" y="1840.7"><tspan x="992" dy="0">Correct/retest the 5 </tspan><tspan x="992" dy="34.1">failures; assign </tspan><tspan x="992" dy="34.1">prerequisites/owners for </tspan><tspan x="992" dy="34.1">the 4 blocked and 3 unrun</tspan><tspan x="992" dy="34.1">cases. Carry evidence </tspan><tspan x="992" dy="34.1">into formal acceptance </tspan><tspan x="992" dy="34.1">retesting.</tspan></text><rect x="1309" y="1804.6000000000001" width="330" height="298.8" fill="#F7F6F4" stroke="#E7E8E9" stroke-width="1"/><text x="1322" y="1840.7"><tspan x="1322" dy="0">Closure requires evidence</tspan><tspan x="1322" dy="34.1">clearing remaining trial </tspan><tspan x="1322" dy="34.1">failures, blockers and </tspan><tspan x="1322" dy="34.1">unrun cases. Formal </tspan><tspan x="1322" dy="34.1">acceptance retesting and </tspan><tspan x="1322" dy="34.1">business approval are </tspan><tspan x="1322" dy="34.1">separate gates, not </tspan><tspan x="1322" dy="34.1">implied by a trial pass.</tspan></text></g><rect x="24" y="80" width="1615" height="2023.4" rx="6" fill="none" stroke="#52637A" stroke-width="1.5"/></svg>
