<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目图表示例</title><style>:root{color-scheme:light;background:#fffefa;color:#0d2046;font:18px/1.7 "Microsoft YaHei","Noto Sans JP",sans-serif}*{box-sizing:border-box}body{max-width:1400px;margin:auto;padding:28px 44px 64px}a{color:#1456d9;text-underline-offset:4px}a:focus-visible{outline:3px solid #c64c38;outline-offset:4px}h1{font-size:36px;line-height:1.3;margin:0 0 12px}h2{font-size:29px;line-height:1.4;margin:0 0 10px}p{max-width:60ch;margin:10px 0}.note,.links{color:#52637a;font-size:16px}nav,.links{display:flex;gap:10px 24px;flex-wrap:wrap}nav{border-bottom:1px solid #d7dce6;padding:18px 0;margin:20px 0 36px}section+section{border-top:1px solid #d7dce6;padding-top:32px;margin-top:48px}figure{margin:20px 0 12px}figure img{display:block;width:100%;height:auto}@media(max-width:700px){body{padding:20px 18px 40px}h1{font-size:29px}h2{font-size:25px}section+section{margin-top:36px;padding-top:28px}}</style><h1>项目图表示例</h1><p class="note">客户服务系统导入｜虚构项目示例｜状态日2026年10月14日</p><nav aria-label="图表类型"><a href="#wbs">工作分解与验收</a><a href="#raci">责任分配矩阵</a><a href="#workflow">变更评估与决策</a><a href="#gantt">项目日程与进度</a></nav><main><section id="wbs"><h2>工作分解与验收</h2><p>将交付范围拆成可验收的工作包，逐项明确完成条件。</p><figure><a href="wbs.svg"><img src="wbs-figure.png" alt="工作分解与验收完整图"></a></figure><p class="links"><a href="wbs.svg">查看矢量图</a><a href="wbs-figure.png">查看完整图片</a><a href="../../../../examples/project-case/zh-CN/wbs.mmd">查看源文件</a></p></section><section id="raci"><h2>责任分配矩阵</h2><p>明确每项工作的最终责任、执行与沟通角色。</p><figure><a href="raci.svg"><img src="raci-figure.png" alt="责任分配矩阵完整图"></a></figure><p class="links"><a href="raci.svg">查看矢量图</a><a href="raci-figure.png">查看完整图片</a><a href="../../../../examples/project-case/zh-CN/raci.json">查看源文件</a></p></section><section id="workflow"><h2>变更评估与决策</h2><p>保留评估、批准、阻止、独立验证与业务验收的关键分支。</p><figure><a href="workflow.svg"><img src="workflow-figure.
