<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kobo Diagrams · Local example</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#152438;background:#f3f5f7}*{box-sizing:border-box}body{max-width:1280px;margin:auto;padding:32px}h1{font-size:26px;margin:0 0 8px}p{line-height:1.55}a{color:#1456d9}.tools{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin:24px 0 16px}label{display:grid;gap:6px;font-weight:600}select,button{font:inherit;padding:9px 12px;border:1px solid #aeb9c7;border-radius:5px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.primary{background:#1456d9;color:white;border-color:#1456d9}.layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(260px,1.4fr);gap:20px}textarea{width:100%;min-height:420px;padding:16px;border:1px solid #aeb9c7;border-radius:5px;resize:vertical;font:14px/1.6 ui-monospace,monospace;background:white;color:#152438}#preview{min-height:420px;padding:20px;overflow:auto;border:1px solid #c9d1da;background:white;border-radius:5px}#preview svg{max-width:100%;height:auto}#status{min-height:1.5em;white-space:pre-wrap;color:#52637a}#status.error{color:#a1272d}.hint{font-size:14px;color:#52637a}@media(max-width:760px){body{padding:20px}.layout{grid-template-columns:1fr}textarea,#preview{min-height:280px}}
  </style>
  <script type="importmap">{"imports":{"mermaid":"../node_modules/mermaid/dist/mermaid.esm.mjs"}}</script>
</head>
<body>
  <h1>Kobo Diagrams</h1>
  <p>A local browser example using one Mermaid engine for ordinary diagrams, enterprise styles, and Kobo JSON tables.</p>
  <p class="hint">Run <code>npm ci</code> and a static server from the package root. Dependencies load locally; no CDN or AI API is used. All sample data is fictional.</p>
  <div class="tools">
    <label for="mode">Renderer<select id="mode"><option value="general">Ordinary Mermaid</option><option value="enterprise">Enterprise style</option><option value="table">RACI table extension</option></select></label>
    <button type="button" class="primary" id="render">Render</button>
    <button type="button" id="download" disabled>Download SVG</button>
  </div>
  <p id="status" role="status" aria-live="polite">Loading local modules…</p>
  <div class="layout">
    <label for="source">Source<textarea id="source" spellcheck="false" aria-describedby="source-hint"></textarea><span class="hint" id="source-hint">Table mode uses taskobo.table/v1 JSON, not native Mermaid syntax.</span></label>
    <section aria-label="Rendered preview" id="preview"></section>
  </div>
  <script type="module">
    const mode = document.querySelector('#mode');
    const source = document.querySelector('#source');
    const preview = document.querySelector('#preview');
    const status = document.querySelector('#status');
    const renderButton = document.querySelector('#render');
    const download = document.querySelector('#download');
    let currentSvg = '';
    let renderSequence = 0;
    try {
      const [{default: mermaid}, core] = await Promise.all([
        import('mermaid'), import('../src/index.mjs'),
      ]);
      const ordinary = core.createMermaidRenderer(mermaid);
      const profile = core.createDiagramProfile({standard: {name: 'Fictional delivery team', version: '1.0'}});
      const [diagramResponse, tableResponse] = await Promise.all([fetch('./plan.mmd'), fetch('./raci.json')]);
      if (!diagramResponse.ok || !tableResponse.ok) throw new Error('Could not load local sample files.');
      const [diagramSample, tableSample] = await Promise.all([diagramResponse.text(), tableResponse.text()]);
      async function render() {
        const sequence = ++renderSequence;
        renderButton.disabled = true;
        download.disabled = true;
        status.className = '';
        status.textContent = 'Rendering…';
        try {
          const result = mode.value === 'general'
            ? await ordinary.render(source.value, {config: {securityLevel: 'strict', htmlLabels: false}})
            : await core.renderDocument(source.value, profile.roles, profile.settings, {mermaid});
          if (sequence !== renderSequence) return;
          preview.innerHTML = result.svg;
          result.bindFunctions?.(preview);
          currentSvg = result.svg;
          download.disabled = false;
          status.textContent = `Core ${core.CORE_VERSION} · Mermaid ${core.MERMAID_VERSION} · ${mode.value === 'general' ? 'ordinary Mermaid' : result.type}`;
        } catch (error) {
          if (sequence !== renderSequence) return;
          preview.replaceChildren();
          currentSvg = '';
          status.className = 'error';
          status.textContent = error?.message || String(error);
        } finally {
          if (sequence === renderSequence) renderButton.disabled = false;
        }
      }
      mode.addEventListener('change', () => {source.value = mode.value === 'table' ? tableSample : diagramSample; render();});
      renderButton.addEventListener('click', render);
      download.addEventListener('click', () => {
        const url = URL.createObjectURL(new Blob([currentSvg], {type: 'image/svg+xml;charset=utf-8'}));
        const link = document.createElement('a');
        link.href = url; link.download = 'example-diagram.svg'; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
      source.value = diagramSample;
      await render();
    } catch (error) {
      status.className = 'error';
      status.textContent = `Setup failed: ${error?.message || error}. Install dependencies and serve this package over HTTP.`;
      renderButton.disabled = true;
    }
  </script>
</body>
</html>
